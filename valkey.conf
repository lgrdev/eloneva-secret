# Configuration Valkey — Eloneva Secret
# Aucune persistance disque, aucun fichier de journal (zéro trace).
save ""
appendonly no

# Mémoire pleine : refuser les écritures, ne jamais évincer un secret.
maxmemory 100mb
maxmemory-policy noeviction

# Journal vers la sortie standard uniquement (pas de fichier).
logfile ""
