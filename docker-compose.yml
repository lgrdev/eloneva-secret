# Eloneva Secret — orchestration Docker.
# Local par défaut (certificat auto-signé, voir scripts/generer-certificat-local.sh).
# Production : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    restart: unless-stopped
    # Zéro trace : aucun journal Docker.
    logging:
      driver: none
    volumes:
      # Configuration en lecture seule uniquement ; aucun volume de données.
      - ./valkey.conf:/etc/valkey/valkey.conf:ro
    # Pas de port publié : Valkey n'est joignable que sur le réseau interne.
    expose:
      - "6379"
    networks:
      - interne
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    logging:
      driver: none
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
    expose:
      - "3000"
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - interne
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    logging:
      driver: none
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443/tcp"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./traefik/traefik.local.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic/options.yml:/etc/traefik/dynamic/options.yml:ro
      - ./traefik/dynamic/routes.yml:/etc/traefik/dynamic/routes.yml:ro
      - ./traefik/dynamic/local.yml:/etc/traefik/dynamic/local.yml:ro
      - ./certs:/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - interne

networks:
  interne:
    driver: bridge
